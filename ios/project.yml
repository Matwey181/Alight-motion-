name: AbsentMotionIOS
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  AbsentMotionIOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: native/AMEasingBridge.cpp
      - path: native/AMProjectBridge.cpp
      - path: native/AMVideoTiming.cpp
      - path: ../shared/cpp/easing.cpp
      - path: ../shared/cpp/xml.cpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.matwey.absentmotion.iosport
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "AbsentMotion iOS Port"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/App/Bridge.h"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/native"
          - "$(SRCROOT)/../shared/cpp"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lexpat"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
